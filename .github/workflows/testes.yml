# Roda os testes do Prumo a cada push na main. Se algo quebrar, aparece um X vermelho no commit.
name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar
        run: npm install --prefix testes
      - name: Testar
        run: node testes/rodar.js
